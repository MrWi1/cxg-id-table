const CATS = ["明星","星神","星尊","颜值","星魁"];
const STORAGE_KEY = "cxg_id_db_v1";      // 本地缓存键
const TOKEN_KEY   = "cxg_admin_token_v1"; // 本地缓存：GitHub Token（可选）

/* =====================================================================
   数据层：云端（GitHub Gist）为主，本地 localStorage 为缓存兜底
   ===================================================================== */
let DB = [];
let currentCat = CATS[0];
let currentKeyword = "";
let isAdmin = false;

/* ---- 云端读写 ---- */
// 从 Gist 拉取数据；未配置 GIST_ID 时退化成本地缓存
async function fetchFromCloud(){
  if(!GIST_ID) return null;
  const token = localStorage.getItem(TOKEN_KEY) || "";
  const headers = { "Accept": "application/vnd.github+json" };
  if(token) headers["Authorization"] = "Bearer " + token;
  // 尝试顺序：代理（若配置了）→ 官方直连；任一成功即返回
  const urls = [];
  if(PROXY) urls.push(API_BASE.replace(/\/$/,"") + "/gists/" + GIST_ID);
  urls.push("https://api.github.com/gists/" + GIST_ID);
  let lastErr;
  for(const url of urls){
    try {
      const res = await fetch(url, { headers });
      if(!res.ok) throw new Error("Gist 读取失败：" + res.status);
      const gist = await res.json();
      // 数据存在第一个文件（data.json）的 content 里
      const file = Object.values(gist.files || {})[0];
      if(!file || !file.content) return [];
      const data = JSON.parse(file.content);
      return Array.isArray(data) ? data : null;
    } catch(e){ lastErr = e; console.warn("[fetchFromCloud] " + url + " 失败：", e); }
  }
  console.warn(lastErr); return null;
}

// 把当前 DB 写回 Gist（会更新整个 Gist 的第一个文件）
async function saveToCloud(db){
  if(!GIST_ID) { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); return false; }
  const token = localStorage.getItem(TOKEN_KEY) || "";
  if(!token){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); return false; }
  const headers = { "Accept": "application/vnd.github+json", "Content-Type": "application/json" };
  headers["Authorization"] = "Bearer " + token;
  try {
    // 先取现有文件结构，保留文件名
    const getRes = await fetch(API_BASE + "/gists/" + GIST_ID, { headers });
    const gist = await getRes.json();
    const fileName = Object.keys(gist.files || { "data.json": {} })[0] || "data.json";
    const res = await fetch(API_BASE + "/gists/" + GIST_ID, {
      method: "PATCH",
      headers,
      body: JSON.stringify({ files: { [fileName]: { content: JSON.stringify(db, null, 2) } } })
    });
    if(!res.ok) throw new Error("Gist 写入失败：" + res.status);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); // 同时更新本地缓存
    return true;
  } catch(e){
    console.warn(e);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); // 离线也先存本地
    return false;
  }
}

/* 本地缓存读写（Gist 未配置 / 离线时的兜底） */

function setStatus(state, text){

}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getCatClass(c){ return "cat-" + c; }

/* =====================================================================
   渲染（仅当前分类）
   ===================================================================== */
function render(highlightName){
  let rows = DB.slice().filter(r => r[0] === currentCat);
  if(currentKeyword){
    const k = currentKeyword.toLowerCase();
    rows = rows.filter(r => r[1].toLowerCase().includes(k) || String(r[2]).includes(k));
  }
  CATS.forEach(c => {
    const el = document.getElementById("num-" + c);
    if(el) el.textContent = DB.filter(r => r[0] === c).length || "";
  });
  countEl.textContent = `${currentCat} 共 ${rows.length} 条记录` + (currentKeyword ? `（搜索："${esc(currentKeyword)}"）` : "");
  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="4" class="empty">暂无数据</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((r) => {
    const origIndex = DB.indexOf(r);
    const isNew = highlightName && r[1] === highlightName ? " badge-new" : "";
    const actionBtns = isAdmin ? `
        <button class="btn btn-primary btn-sm" onclick="copyId('${esc(String(r[2]))}')">复制ID</button>
        <button class="btn btn-success btn-sm" onclick="startEdit(${origIndex})">修改</button>
        <button class="btn btn-danger btn-sm" onclick="delEntry(${origIndex})">删除</button>` : `
        <button class="btn btn-primary btn-sm" onclick="copyId('${esc(String(r[2]))}')">复制ID</button>`;
    return `<tr data-i="${origIndex}" class="${isNew}">
      <td><span class="cat-tag ${getCatClass(r[0])}">${r[0]}</span></td>
      <td>${esc(r[1])}</td>
      <td class="id-cell">${esc(String(r[2])) || '<span style="color:#bbb">无</span>'}</td>
      <td class="actions">${actionBtns}</td>
    </tr>`;
  }).join("");
}

/* =====================================================================
   搜索（输入变化实时响应）
   ===================================================================== */
function applyKeyword(kw){
  currentKeyword = kw;
  if(kw === ""){ searchInput.value = ""; }
  render();
}
function doSearch(){ applyKeyword(searchInput.value.trim()); }
function clearSearch(){ applyKeyword(""); toast("已清除搜索"); }
searchInput.addEventListener("input", function(){ applyKeyword(this.value.trim()); });
searchInput.addEventListener("keydown", e => { if(e.key === "Enter") doSearch(); });
document.getElementById("btnSearch").addEventListener("click", doSearch);
document.getElementById("btnClear").addEventListener("click", clearSearch);

/* =====================================================================
   分类标签
   ===================================================================== */
document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  currentCat = t.dataset.cat;
  currentKeyword = ""; searchInput.value = "";
  render();
});

/* =====================================================================
   添加（管理员）
   ===================================================================== */
document.getElementById("btnAdd").addEventListener("click", addEntry);
async function addEntry(){
  if(!isAdmin) return toast("仅管理员可添加");
  const cat = document.getElementById("addCat").value;
  const name = document.getElementById("addName").value.trim();
  const id = document.getElementById("addId").value.trim();
  if(!name){ toast("请输入名称"); return; }
  if(DB.some(r => r[1] === name)){ toast("该名称已存在"); return; }
  DB.push([cat, name, id]);
  const ok = await saveToCloud(DB);
  document.getElementById("addName").value = "";
  document.getElementById("addId").value = "";
  switchCat(cat);
  render(name);
  toast(ok ? "已添加并同步到云端（已切换到 " + cat + "）" : "已添加（离线，已存本地）");
}

/* =====================================================================
   删除（行内确认，三按钮同行）
   ===================================================================== */
function delEntry(i){
  if(!isAdmin){ toast("仅管理员可删除"); return; }
  const name = DB[i] ? DB[i][1] : "";
  if(!name) return;
  const tr = tbody.querySelector(`tr[data-i="${i}"]`);
  if(tr && tr.classList.contains("confirm-del")){
    DB.splice(i, 1);
    saveToCloud(DB).then(ok => toast(ok ? "已删除并同步云端" : "已删除（离线）"));
    render();
    return;
  }
  if(tr){
    tr.classList.add("confirm-del");
    let bar = tr.querySelector(".del-confirm");
    if(!bar){
      bar = document.createElement("span");
      bar.className = "del-confirm";
      bar.style.cssText = "margin-left:8px;display:inline-flex;align-items:center;gap:6px;color:#e74c3c;font-size:12px;";
      bar.innerHTML = `确定删除「${esc(name)}」吗？<button class="btn btn-danger btn-sm" onclick="delEntry(${i})">确认</button><button class="btn btn-sm" style="background:#95a5a6" onclick="cancelDel(${i})">取消</button>`;
      const td = tr.querySelector(".actions");
      if(td) td.appendChild(bar);
    }
  }
}
function cancelDel(i){ render(); }

/* =====================================================================
   修改（管理员；保存后自动归入对应分类）
   ===================================================================== */
function startEdit(i){
  if(!isAdmin) return toast("仅管理员可修改");
  const r = DB[i]; if(!r) return;
  tbody.querySelectorAll("tr.edit-row").forEach(tr => tr.classList.remove("edit-row"));
  const tr = tbody.querySelector(`tr[data-i="${i}"]`);
  if(!tr) return;
  tr.classList.add("edit-row");
  tr.innerHTML = `
    <td>
      <select>
        <option ${r[0]==="明星"?"selected":""}>明星</option>
        <option ${r[0]==="星神"?"selected":""}>星神</option>
        <option ${r[0]==="星尊"?"selected":""}>星尊</option>
        <option ${r[0]==="颜值"?"selected":""}>颜值</option>
        <option ${r[0]==="星魁"?"selected":""}>星魁</option>
      </select>
    </td>
    <td><input value="${esc(r[1])}"></td>
    <td><input value="${esc(String(r[2]))}"></td>
    <td class="actions">
      <button class="btn btn-success btn-sm" onclick="saveEdit(${i})">保存</button>
      <button class="btn btn-sm" style="background:#95a5a6" onclick="cancelEdit()">取消</button>
    </td>`;
  tr.querySelector("input").focus();
}
async function saveEdit(i){
  const tr = tbody.querySelector("tr.edit-row"); if(!tr) return;
  const sel = tr.querySelectorAll("input");
  const cat = tr.querySelector("select").value;
  const name = sel[0].value.trim();
  const id = sel[1].value.trim();
  if(!name){ toast("名称不能为空"); return; }
  DB[i] = [cat, name, id];
  const ok = await saveToCloud(DB);
  switchCat(cat);
  render(name);
  toast(ok ? "已更新并同步云端（已切换到 " + cat + "）" : "已更新（离线）");
}
function cancelEdit(){ render(); }

/* 切换分类 Tab */
function switchCat(cat){
  currentCat = cat;
  document.querySelectorAll(".tab").forEach(x => {
    x.classList.toggle("active", x.dataset.cat === cat);
  });
  currentKeyword = ""; searchInput.value = "";
}

/* =====================================================================
   复制（所有人可用）
   ===================================================================== */
function copyId(id){
  if(!id){ toast("该条目无 ID"); return; }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(id).then(() => toast("ID 已复制：" + id)).catch(() => fallbackCopy(id));
  } else { fallbackCopy(id); }
}
function fallbackCopy(id){
  const ta = document.createElement("textarea");
  ta.value = id; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("ID 已复制：" + id); } catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}

/* =====================================================================
   提示
   ===================================================================== */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* =====================================================================
   初始化：先取云端数据，失败则用本地缓存/初始数据
   ===================================================================== */
async function init(){
  setStatus("offline", "正在连接云端…");
  // 优先云端
  const cloud = await fetchFromCloud();
  if(cloud && Array.isArray(cloud) && cloud.length){
    DB = cloud;
    saveLocal(DB); // 更新本地缓存
    setStatus("online", "云端已同步 · 所有人看到的数据一致");
  } else {
    // 云端不可用 / 未配置：用本地缓存或初始数据
    const local = loadLocal();
    DB = local.length ? local : INITIAL.slice();
    if(!local.length) saveLocal(DB);
    setStatus(GIST_ID ? "error" : "offline",
      GIST_ID ? "云端暂不可用，当前为本地数据（检查 Gist/Token 配置）" : "尚未配置云端，数据仅保存在本浏览器（请按注释配置 Gist）");
  }
  // 首次去重
  dedupe();
  switchCat(CATS[0]);
  render();
}
function dedupe(){
  const seen = new Set(); const uniq = [];
  for(const r of DB){ const k = r[1]; if(seen.has(k)) continue; seen.add(k); uniq.push(r); }
  if(uniq.length !== DB.length){ DB = uniq; saveLocal(DB); }
}

/* 管理员登录相关事件 */
document.getElementById("btnLogin").addEventListener("click", () => {
  document.getElementById("adminPanel").classList.add("open");
  document.getElementById("adminPwd").focus();
});
document.getElementById("btnPwdLogin").addEventListener("click", () => {
  const pwd = document.getElementById("adminPwd").value;
  if(checkPassword(pwd)){ setAdmin(true); toast("已进入管理员模式"); }
  else { toast("密码错误"); }
});
document.getElementById("adminPwd").addEventListener("keydown", e => {
  if(e.key === "Enter") document.getElementById("btnPwdLogin").click();
});
document.getElementById("btnLogout").addEventListener("click", () => setAdmin(false));

init();
